<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Polnareff Land</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      background: linear-gradient(180deg, #dfe9f3, #b9cce7);
      color: #050505;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* BANNIÈRE */
    .header img {
      width: 100%;
      display: block;
    }

    /* NAVIGATION */
    .nav {
      background: rgba(24, 119, 242, 0.9);
      padding: 10px 16px;
      font-size: 14px;
    }

    .nav a {
      color: #ffffff;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    /* TABLE FORUM */
    .forum {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.75);
    }

    .forum th {
      background: linear-gradient(#e7f0ff, #d0e2ff);
      padding: 10px;
      text-align: left;
      color: #1c1e21;
      border-bottom: 1px solid #b6ccf2;
    }

    .forum td {
      padding: 12px 10px;
      border-bottom: 1px solid #dbe4f3;
    }

    .forum tr:hover td {
      background: rgba(24, 119, 242, 0.08);
    }

    .category td {
      background: linear-gradient(#f0f5ff, #e3edff);
      font-weight: bold;
      color: #1a2a6b;
      border-bottom: 1px solid #c3d6f5;
    }

    .video-title {
      font-weight: bold;
      color: #1877f2;
    }

    .video-desc {
      font-size: 13px;
      color: #606770;
      margin-top: 4px;
    }

    .forum a {
      color: #1877f2;
      font-weight: bold;
      text-decoration: none;
    }

    .forum a:hover {
      text-decoration: underline;
    }

    /* FOOTER */
    .footer {
      background: rgba(255, 255, 255, 0.6);
      padding: 10px;
      font-size: 12px;
      text-align: center;
      color: #606770;
      border-top: 1px solid #dbe4f3;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- BANNIÈRE -->
    <div class="header">
      <img src="Polnareffland.png" alt="Polnareff Land">
    </div>

    <!-- NAV -->
    <div class="nav">
      <a href="#">Accueil</a>
      <a href="#">Catégories</a>
      <a href="#">Derniers ajouts</a>
    </div>

    <!-- CONTENU -->
    <table class="forum">
      <tr>
        <th colspan="2">Catégories</th>
      </tr>

      <tr class="category">
        <td colspan="2">Sites avec VO &amp; VF</td>
      </tr>

      <tr>
        <td width="70%">
          <div class="video-title">Anime Sama</div>
        </td>
        <td width="30%">
          <a href="https://anime-sama.eu/" target="_blank">Accéder au site</a>
        </td>
      </tr>

      <tr>
        <td width="70%">
          <div class="video-title">Voiranime</div>
        </td>
        <td width="30%">
          <a href="https://v6.voiranime.com/page/3/" target="_blank">Accéder au site</a>
        </td>
      </tr>
    </table>

    <!-- FOOTER -->
    <div class="footer">
      Site hébergé gratuitement sur GitHub Pages
    </div>

  </div>
</body>
</html>
