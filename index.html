<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Polnareff Land</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      background: #e4e9f2;
      color: #1c1e21;
    }

    /* BARRE FACEBOOK */
    .topbar {
      background: #3b5998;
      color: #fff;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
    }

    .layout {
      max-width: 1200px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
    }

    /* COLONNE GAUCHE */
    .sidebar {
      width: 260px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid #cbd3e6;
      border-radius: 6px;
      padding: 12px;
      height: fit-content;
    }

    .profile-box {
      text-align: center;
    }

    .profile-box img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 1px solid #aab4cc;
      background: #fff;
    }

    .profile-name {
      margin-top: 10px;
      font-weight: bold;
      color: #3b5998;
    }

    .profile-link a {
      font-size: 13px;
      color: #1877f2;
      text-decoration: none;
    }

    .profile-link a:hover {
      text-decoration: underline;
    }

    /* CONTENU CENTRAL */
    .container {
      flex: 1;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid #cbd3e6;
      border-radius: 6px;
      overflow: hidden;
    }

    .header img {
      width: 100%;
      display: block;
    }

    .nav {
      background: #f5f6f7;
      border-bottom: 1px solid #ccd0d5;
      padding: 8px 12px;
      font-size: 13px;
    }

    .nav a {
      color: #365899;
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    table.forum {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.forum th {
      background: #e9ebee;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ccd0d5;
    }

    table.forum td {
      padding: 10px 8px;
      border-bottom: 1px solid #e4e6eb;
    }

    .category td {
      background: #f0f2f5;
      font-weight: bold;
      color: #3b5998;
    }

    .video-title {
      font-weight: bold;
      color: #1877f2;
    }

    table.forum a {
      color: #1877f2;
      text-decoration: none;
      font-weight: bold;
    }

    table.forum a:hover {
      text-decoration: underline;
    }

    .footer {
      background: #f5f6f7;
      text-align: center;
      font-size: 12px;
      padding: 8px;
      color: #606770;
      border-top: 1px solid #ccd0d5;
    }

    /* TikTok flottant pour mobile */
    .tiktok-mobile {
      display: none;           /* caché par défaut */
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff0050;     /* couleur TikTok */
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    /* Affichage uniquement sur petits écrans */
    @media (max-width: 768px) {
      .tiktok-mobile {
        display: block;
      }

      /* Masquer le lien dans la sidebar */
      .profile-link {
        display: none;
      }

      /* Réorganiser la layout pour mobile */
      .layout {
        flex-direction: column;
        margin: 10px;
      }

      .sidebar {
        width: 100%;
        margin-bottom: 20px;
      }

      .container {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- BARRE FACEBOOK -->
  <div class="topbar">
    Polnareff Land
  </div>

  <div class="layout">

    <!-- PROFIL GAUCHE -->
    <div class="sidebar">
      <div class="profile-box">
        <img src="roronoa-bledart-logo.png" alt="Roronoa Bled'Art">
        <div class="profile-name">roronoa.bled.art.95</div>
        <div class="profile-link">
          <a href="https://www.tiktok.com/@roronoa.bled.art.95" target="_blank">
            Voir mon TikTok
          </a>
        </div>
      </div>
    </div>

    <!-- CONTENU -->
    <div class="container">

      <div class="header">
        <img src="Polnareffland.png" alt="Polnareff Land">
      </div>

      <div class="nav">
        <a href="#">Accueil</a>
        <a href="#">Catégories</a>
        <a href="#">Derniers ajouts</a>
      </div>

      <table class="forum">
        <tr>
          <th colspan="2">Catégories</th>
        </tr>

        <tr class="category">
          <td colspan="2">Sites avec VO &amp; VF</td>
        </tr>

        <tr>
          <td width="70%">
            <div class="video-title">Anime Sama</div>
          </td>
          <td width="30%">
            <a href="https://anime-sama.eu/" target="_blank">Accéder au site</a>
          </td>
        </tr>

        <tr>
          <td>
            <div class="video-title">Voiranime</div>
          </td>
          <td>
            <a href="https://v6.voiranime.com/page/3/" target="_blank">Accéder au site</a>
          </td>
        </tr>
      </table>

      <div class="footer">
        Site hébergé gratuitement sur GitHub Pages
      </div>

    </div>
  </div>

  <!-- Bouton TikTok flottant pour mobile -->
  <a href="https://www.tiktok.com/@roronoa.bled.art.95" target="_blank" class="tiktok-mobile">
    TikTok
  </a>

</body>
</html>
