<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Polnareff Land</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      background: #d0d8e8;
      color: #1c1e21;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      background: linear-gradient(#4c69ba, #3b5998);
      color: #fff;
      padding: 8px 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    .topbar input {
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #ccd0d5;
      font-size: 13px;
    }

    /* ===== LAYOUT ===== */
    .layout {
      max-width: 1200px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
    }

    /* ===== SIDEBAR PC ===== */
    .sidebar {
      width: 260px;
      background: rgba(255,255,255,.85);
      border: 1px solid #cbd3e6;
      border-radius: 8px;
      padding: 12px;
    }

    .profile-box {
      text-align: center;
      margin-bottom: 15px;
    }

    .profile-box img {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #aab4cc;
    }

    .profile-name {
      margin-top: 8px;
      font-weight: bold;
      color: #3b5998;
    }

    .profile-link a {
      color: #ff0050;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }

    /* Coups de cœurs (PC) */
    .favorites {
      margin-top: 20px;
      border-top: 1px solid #ccd0d5;
      padding-top: 10px;
    }

    .favorites h3 {
      font-size: 14px;
      margin: 0 0 8px;
      color: #3b5998;
    }

    .favorites a {
      display: block;
      font-size: 13px;
      color: #1877f2;
      text-decoration: none;
      margin-bottom: 6px;
    }

    /* ===== CONTENU ===== */
    .container {
      flex: 1;
      background: rgba(255,255,255,.9);
      border: 1px solid #cbd3e6;
      border-radius: 8px;
      overflow: hidden;
    }

    .header img {
      width: 100%;
      display: block;
    }

    .nav {
      background: #f5f6f7;
      padding: 8px 12px;
      border-bottom: 1px solid #ccd0d5;
      font-size: 13px;
    }

    .nav a {
      margin-right: 15px;
      color: #365899;
      font-weight: bold;
      text-decoration: none;
    }

    table.forum {
      width: 100%;
      border-collapse: collapse;
    }

    table.forum th {
      background: #e9ebee;
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ccd0d5;
    }

    table.forum td {
      padding: 10px 8px;
      border-bottom: 1px solid #e4e6eb;
    }

    .category td {
      background: #f0f2f5;
      font-weight: bold;
      color: #3b5998;
    }

    .video-title {
      font-weight: bold;
      color: #1877f2;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      padding: 8px;
      background: #f5f6f7;
      border-top: 1px solid #ccd0d5;
    }

    /* ===== MOBILE ===== */
    .mobile-profile {
      display: none;
      text-align: center;
      margin: 20px;
    }

    .mobile-profile img {
      width: 100px;
      border-radius: 10px;
      border: 2px solid #aab4cc;
    }

    .mobile-profile a {
      display: inline-block;
      margin-top: 10px;
      background: #ff0050;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        margin: 10px;
      }

      .sidebar {
        display: none;
      }

      .mobile-profile {
        display: block;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    Polnareff Land
    <input type="text" placeholder="Rechercher...">
  </div>

  <div class="layout">

    <!-- SIDEBAR PC -->
    <div class="sidebar">
      <div class="profile-box">
        <img src="roronoa-bledart-logo.png">
        <div class="profile-name">roronoa.bled.art.95</div>
        <div class="profile-link">
          <a href="https://www.tiktok.com/@roronoa.bled.art.95" target="_blank">TikTok</a>
        </div>
      </div>

      <div class="favorites">
        <h3>Nos coups de cœurs ❤️</h3>
        <a href="https://sekai.one/" target="_blank">Sekai One</a>
        <a href="https://anime-sama.eu/" target="_blank">Anime Sama</a>
      </div>
    </div>

    <!-- CONTENU -->
    <div class="container">
      <div class="header">
        <img src="Polnareffland.png">
      </div>

      <div class="nav">
        <a href="#">Accueil</a>
        <a href="#">Catégories</a>
        <a href="#">Derniers ajouts</a>
      </div>

      <table class="forum">
        <tr><th colspan="2">Sites avec VO &amp; VF</th></tr>
        <tr><td class="video-title">Anime Sama</td><td><a href="https://anime-sama.eu/" target="_blank">Accéder</a></td></tr>
        <tr><td class="video-title">Voiranime</td><td><a href="https://v6.voiranime.com/page/3/" target="_blank">Accéder</a></td></tr>
        <tr><td class="video-title">Vostfree</td><td><a href="https://vostfree.ws/" target="_blank">Accéder</a></td></tr>

        <tr class="category"><td colspan="2">Sites seulement en VO</td></tr>
        <tr><td class="video-title">Sekai One</td><td><a href="https://sekai.one/" target="_blank">Accéder</a></td></tr>
      </table>

      <div class="footer">Site hébergé gratuitement sur GitHub Pages</div>
    </div>
  </div>

  <!-- MOBILE : PROFIL EN BAS -->
  <div class="mobile-profile">
    <img src="roronoa-bledart-logo.png">
    <br>
    <a href="https://www.tiktok.com/@roronoa.bled.art.95" target="_blank">Voir mon TikTok</a>
  </div>

</body>
</html>
